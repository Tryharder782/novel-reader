<!DOCTYPE html>
<html lang="ru" data-theme="dark" data-ui="minimal" data-font="sans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16161e">
  <meta name="robots" content="noindex, nofollow">
  <title>Читалка</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/iui.css">
</head>
<body>
  <div id="read-progress"></div>
  <header id="topbar">
    <button id="btn-back" class="icon-btn" aria-label="Назад" hidden>‹</button>
    <div id="topbar-title">Читалка</div>
    <button id="btn-aa" class="icon-btn" aria-label="Настройки текста" hidden>Aa</button>
  </header>

  <main id="app"></main>

  <div id="sheet" aria-hidden="true">
    <div class="sheet-panel">
      <div class="sheet-grip" data-close></div>
      <div id="sheet-body"></div>
    </div>
  </div>

  <div id="toast"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
